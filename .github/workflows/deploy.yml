name: Deploy

# Rolt de site uit bij elke push naar main, dus ook bij een commit die de
# adminpagina maakt. Zonder dit zou publiceren wel een commit opleveren maar
# niets veranderen aan de live site.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      announce_test:
        description: >-
          Stuur één testbericht naar Telegram, om te zien of de bot en het
          chat-id kloppen. Dit bericht komt in de echte groep terecht.
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Twee commits diep, want scripts/announce.mjs vergelijkt deze stand met
      # de vorige. Met de standaard van één commit valt er niets te vergelijken.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Vóór de build, want een foto met GPS-coordinaten erin hoort de deploy
      # tegen te houden. Dat is geen schoonheidsfoutje maar het publiceren van
      # een huisadres, en dat kun je achteraf niet meer terugnemen.
      - name: Check the card photos
        run: npm run photos -- --check

      - run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ember

      # Het menu naast het tekstvak in Telegram, gelijkgetrokken met
      # functions/_lib/commands.js. Eén API-aanroep, dus die mag elke keer.
      # Anders moet je na elk nieuw commando met de hand een script draaien en
      # je token opnieuw invoeren, en dat vergeet je een keer.
      - name: Sync Telegram command menu
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/telegram-commands.mjs

      # Pas ná de deploy, zodat de links in het bericht ook echt ergens heen
      # gaan. Mislukt dit, dan is dat vervelend maar geen reden om de deploy
      # rood te maken: de site staat er dan al goed op.
      - name: Announce on Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        # Bij een gewone push is `inputs` leeg, dus staat er niets achter en
        # doet hij de normale diff.
        run: node scripts/announce.mjs ${{ inputs.announce_test && '--test' || '' }}
